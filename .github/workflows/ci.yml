name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build examples and theme previews
        run: node tools/build.js
      - name: Built pages are committed and up to date
        run: git diff --exit-code -- examples skills/blaude/themes
      - name: check-artifact
        run: node tools/check-artifact.js
      - name: check-theme
        run: node tools/check-theme.js
      - name: export
        run: node tools/test-export.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build blaude-skill.zip
        run: |
          # Zip the folder from its parent so blaude/ is the archive's top-level entry.
          (cd skills && zip -r -X ../blaude-skill.zip blaude -x '*.DS_Store')
          unzip -l blaude-skill.zip
          unzip -l blaude-skill.zip | grep -qE ' blaude/SKILL\.md$'
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Blaude $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" blaude-skill.zip --clobber
