<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blaude</title>
<meta name="description" content="Notes on how the web works and how this blog builds itself. Written in Claude, published as artifacts.">
<meta property="og:type" content="website">
<meta property="og:title" content="Blaude">
<meta property="og:description" content="Notes on how the web works and how this blog builds itself. Written in Claude, published as artifacts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
:root{
  color-scheme:light dark;
  --bl-bg:light-dark(#ffffff,#131417);
  --bl-surface:light-dark(#f3f4f6,#1d1f24);
  --bl-ink:light-dark(#1a1b1f,#e9e9ec);
  --bl-ink-muted:light-dark(#5d6170,#a3a7b3);
  --bl-accent:light-dark(#2950b8,#93adff);
  --bl-accent-ink:light-dark(#ffffff,#0f1320);
  --bl-rule:light-dark(#e2e4e9,#2c2f36);
  --bl-good:light-dark(#1d7a4a,#6fd39b);
  --bl-warn:light-dark(#a35a00,#f0b25a);
  --bl-bad:light-dark(#b42318,#ff8f86);
  --bl-chart-1:light-dark(#2950b8,#93adff);
  --bl-chart-2:light-dark(#a35a00,#f0b25a);
  --bl-chart-3:light-dark(#1d7a4a,#6fd39b);
  --bl-chart-4:light-dark(#7a3db8,#c9a2ff);
  --bl-chart-5:light-dark(#b42318,#ff8f86);
  --bl-chart-6:light-dark(#0e7490,#5fd0e6);
  --bl-term-bg:light-dark(#16181d,#0b0c0f);
  --bl-term-ink:light-dark(#e6e7ea,#e6e7ea);
  --bl-term-dim:light-dark(#8b90a0,#8b90a0);
  --bl-term-ok:light-dark(#7fd8a4,#7fd8a4);
  --bl-term-key:light-dark(#9fb7ff,#9fb7ff);
  --bl-term-rule:light-dark(#3a3e48,#2a2d35);
  --bl-font-body:'Literata',Georgia,serif;
  --bl-font-heading:'Instrument Sans',system-ui,sans-serif;
  --bl-font-mono:'JetBrains Mono',ui-monospace,monospace;
  --bl-size-body:17px;
  --bl-measure:680px;
  --bl-radius:10px;
  --bl-s1:8px;
  --bl-s2:16px;
  --bl-s3:24px;
  --bl-s4:40px;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
/* Blaude base.css: layout and typography for posts and indexes.
   Reads theme tokens only (var(--bl-*)). Spacing uses only --bl-s1..--bl-s4.
   Header, body and footer share one column: .bl-col. */

:root{
  color-scheme:light dark;
  --bl-pad:max(5vw,20px,env(safe-area-inset-left),env(safe-area-inset-right));
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}

*,*::before,*::after{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(44px + var(--bl-s4))}
body{margin:0;background:var(--bl-bg);color:var(--bl-ink);font:var(--bl-size-body)/1.65 var(--bl-font-body);overflow-x:clip;overflow-wrap:break-word}
img,svg,video{max-width:100%}
img{height:auto}
a{color:var(--bl-accent);text-underline-offset:.2em;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--bl-accent);outline-offset:2px}
[hidden]{display:none!important}

/* One column */
.bl-col{max-width:calc(var(--bl-measure) + 2*var(--bl-pad));margin-inline:auto;padding-inline:var(--bl-pad)}

/* Tap targets: at least 44 x 44 */
.bl-hit{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}

/* Buttons */
.bl-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 var(--bl-s2);border-radius:var(--bl-radius);border:1px solid var(--bl-rule);background:var(--bl-surface);color:var(--bl-ink);font:600 15px/1 var(--bl-font-heading);cursor:pointer;flex:none}
.bl-btn--primary{background:var(--bl-accent);border-color:var(--bl-accent);color:var(--bl-accent-ink)}
.bl-btn--quiet{background:var(--bl-bg);font-size:13px}
.bl-btn:disabled{opacity:.4;cursor:default}
.bl-textbtn{display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0;border:0;background:none;font:inherit;color:var(--bl-accent);cursor:pointer}

/* Sticky post header */
.bl-bar{position:sticky;top:0;z-index:5;background:var(--bl-bg);border-bottom:1px solid var(--bl-rule);font:600 15px/1.2 var(--bl-font-heading);padding-top:env(safe-area-inset-top)}
.bl-bar .bl-col{display:flex;justify-content:space-between;align-items:center;gap:var(--bl-s2);min-height:calc(44px + var(--bl-s1))}
.bl-bar a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;color:var(--bl-ink);text-decoration:none}
.bl-bar nav{display:flex;gap:var(--bl-s3)}
.bl-bar nav a{justify-content:flex-end;color:var(--bl-ink-muted);font-weight:400}
.bl-bar a:hover{color:var(--bl-accent)}

/* Post */
.bl-post{padding-top:var(--bl-s4)}
.bl-title{font:600 clamp(30px,5.6vw,40px)/1.12 var(--bl-font-heading);letter-spacing:-.015em;margin:0 0 var(--bl-s2)}
.bl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--bl-s1) var(--bl-s2);margin:0 0 var(--bl-s4);font:14px/1.4 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-body h2{font:600 24px/1.2 var(--bl-font-heading);margin:var(--bl-s4) 0 var(--bl-s1)}
.bl-body h3{font:600 19px/1.3 var(--bl-font-heading);margin:var(--bl-s3) 0 var(--bl-s1)}
.bl-body h4{font:600 17px/1.3 var(--bl-font-heading);margin:var(--bl-s3) 0 var(--bl-s1)}
.bl-body p{margin:0 0 var(--bl-s2);text-wrap:pretty}
.bl-body>p:first-child{font-size:20px;line-height:1.55}
.bl-body ul,.bl-body ol{margin:0 0 var(--bl-s2);padding-left:var(--bl-s3)}
.bl-body li>p{margin:0}
.bl-body blockquote{margin:0 0 var(--bl-s2);padding-left:var(--bl-s2);border-left:3px solid var(--bl-rule);color:var(--bl-ink-muted)}
.bl-body hr{border:0;border-top:1px solid var(--bl-rule);margin:var(--bl-s4) 0}
.bl-body code{font-family:var(--bl-font-mono);font-size:.88em;background:var(--bl-surface);border-radius:calc(var(--bl-radius)/2);box-shadow:0 0 0 2px var(--bl-surface)}
.bl-body pre{margin:0 0 var(--bl-s3);padding:var(--bl-s2);background:var(--bl-surface);border-radius:var(--bl-radius);overflow-x:auto;font:14px/1.6 var(--bl-font-mono)}
.bl-body pre code{font-size:inherit;background:none;box-shadow:none;border-radius:0}
.bl-body img{display:block;border-radius:var(--bl-radius)}

/* Tables scroll inside their own box */
.bl-table{overflow-x:auto;margin:0 0 var(--bl-s3)}
.bl-table table{border-collapse:collapse;width:100%;font:15px/1.4 var(--bl-font-heading)}
.bl-table th,.bl-table td{text-align:left;padding:var(--bl-s1) var(--bl-s2) var(--bl-s1) 0;border-bottom:1px solid var(--bl-rule);vertical-align:top}
.bl-table th{font-weight:600}
.bl-table td.bl-num,.bl-table th.bl-num{text-align:right;font-variant-numeric:tabular-nums}

/* Related links */
.bl-related{margin-top:var(--bl-s4);padding-top:var(--bl-s3);border-top:1px solid var(--bl-rule)}
.bl-related h2{font:600 15px/1.2 var(--bl-font-heading);margin:0}
.bl-related ul{list-style:none;margin:var(--bl-s1) 0 0;padding:0}
.bl-related a{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding-block:var(--bl-s1);color:var(--bl-ink);text-decoration:none;font:17px/1.4 var(--bl-font-heading)}
.bl-related a:hover .bl-related-t{color:var(--bl-accent)}
.bl-related-n{font-size:14px;color:var(--bl-ink-muted)}

/* Footer */
.bl-foot{margin-top:var(--bl-s4);border-top:1px solid var(--bl-rule);font:15px/1.5 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-foot .bl-col{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 var(--bl-s2);padding-top:var(--bl-s2);padding-bottom:max(var(--bl-s4),env(safe-area-inset-bottom))}
.bl-foot a{display:inline-flex;align-items:center;min-height:44px}

/* Reserve the height of the tallest item: children share one grid cell */
.bl-stack{display:grid}
.bl-stack>*{grid-area:1/1}
.bl-stack>[aria-hidden=true]{visibility:hidden}

/* Visually hidden, still read aloud */
.bl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* Ledger index: a contents page, posts grouped by year */
.bl-ix-head{padding-top:var(--bl-s4)}
.bl-ix-name{font:600 22px/1.2 var(--bl-font-heading);margin:0}
.bl-ix-intro{font-size:18px;line-height:1.55;margin:var(--bl-s1) 0 0}
.bl-ix-nav{display:flex;flex-wrap:wrap;gap:0 var(--bl-s3);margin-top:var(--bl-s1);font:15px/1.2 var(--bl-font-heading)}
.bl-ix-nav a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;color:var(--bl-ink-muted);text-decoration:none}
.bl-ix-nav a:hover{color:var(--bl-ink)}
.bl-ix-sec{margin-top:var(--bl-s3);padding-top:var(--bl-s3);border-top:1px solid var(--bl-rule)}
.bl-ix-headrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 var(--bl-s2)}
.bl-ix-sec h2{font:600 15px/1.3 var(--bl-font-heading);margin:0}
.bl-filter{display:flex;flex-wrap:wrap;gap:0;font:14px/1.2 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-filter button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 var(--bl-s1);border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.bl-filter button[aria-pressed=true]{color:var(--bl-ink);text-decoration:underline;text-decoration-color:var(--bl-accent);text-decoration-thickness:2px;text-underline-offset:4px}
.bl-yr{font:600 13px/1 var(--bl-font-mono);color:var(--bl-ink-muted);margin:var(--bl-s2) 0 0}
.bl-rows{list-style:none;margin:0;padding:0}
.bl-row{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:0 var(--bl-s2);align-items:baseline;align-content:center;min-height:44px;padding-block:var(--bl-s1);color:inherit;text-decoration:none}
.bl-row--plain{grid-template-columns:minmax(0,1fr)}
a.bl-row:hover .bl-t{color:var(--bl-accent)}
.bl-d{font:13.5px/1.4 var(--bl-font-mono);color:var(--bl-ink-muted);white-space:nowrap}
.bl-t{font:17px/1.4 var(--bl-font-heading)}
.bl-n{display:block;font:14px/1.4 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-empty{margin:var(--bl-s2) 0 0;color:var(--bl-ink-muted);font-style:italic}
.bl-ix-about p{margin:var(--bl-s1) 0 0}
.bl-ix-about code{font:.88em var(--bl-font-mono)}
.bl-links{display:flex;flex-wrap:wrap;gap:0 var(--bl-s3);margin-top:var(--bl-s1);font:15px/1.2 var(--bl-font-heading)}
.bl-links a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;text-decoration:none}
.bl-ix-foot{font-size:14px}
.bl-mail{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--bl-s2)}

</style>
</head>
<body>
<div class="bl-col">
<header class="bl-ix-head" data-bl-region="header">
<h1 class="bl-ix-name" id="bl-name">Blaude</h1>
<p class="bl-ix-intro" id="bl-intro">Notes on how the web works and how this blog builds itself. Written in Claude, published as artifacts.</p>
<nav class="bl-ix-nav" id="bl-nav" aria-label="Sections"></nav>
</header>
<main id="bl-sections" data-bl-region="body"></main>
</div>
<footer class="bl-foot bl-ix-foot"><div class="bl-col" data-bl-region="footer"><span class="bl-mail" id="bl-mail"></span><span>Made with Blaude</span></div></footer>
<script type="application/json" id="blaude-config">{
  "blaude": "1.0",
  "blogId": "demo-0001",
  "blog": {
    "name": "Blaude",
    "tagline": "Notes on how the web works and how this blog builds itself. Written in Claude, published as artifacts.",
    "author": "Blaude",
    "bio": "Blaude is an open-source plugin that turns your writing into a blog made of Claude artifacts. You write; Claude builds the pages, adds figures and keeps this index up to date. No hosting, no terminal.",
    "email": "hello@example.com",
    "links": [
      {
        "label": "GitHub",
        "url": "https://github.com/Doppp/blaude"
      }
    ]
  },
  "theme": {
    "name": "ledger"
  },
  "sections": [
    {
      "type": "posts",
      "id": "posts",
      "title": "Writing"
    },
    {
      "type": "about",
      "id": "about",
      "title": "About"
    }
  ],
  "posts": [
    {
      "slug": "AUuouYvrKE1t5ecSd8eRYm",
      "url": "https://claude.ai/artifact/AUuouYvrKE1t5ecSd8eRYm",
      "title": "How a post gets published",
      "date": "2026-11-24",
      "description": "From a draft in chat to a public page on your blog, in five steps.",
      "tags": [
        "guide",
        "basics"
      ],
      "status": "public",
      "readingMinutes": 4,
      "blaudeVersion": "1.0.0",
      "theme": "ledger"
    },
    {
      "slug": "KbK4HARDNTL3p1dzS6KS5a",
      "url": "https://claude.ai/artifact/KbK4HARDNTL3p1dzS6KS5a",
      "title": "What happens when you open a link",
      "date": "2026-11-22",
      "description": "Four round trips between tapping a link and seeing a page: DNS, TCP, TLS and HTTP.",
      "tags": [
        "web",
        "networking"
      ],
      "status": "public",
      "readingMinutes": 6,
      "blaudeVersion": "1.0.0",
      "theme": "ledger"
    }
  ]
}</script>
<script>
{
  // Renders the whole page from #blaude-config. Every value is text: escaped or set with textContent.
  const cfg = JSON.parse(document.getElementById('blaude-config').textContent);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // http(s), mailto, #anchors, or a relative path (an exported blog); never javascript: or other schemes.
  const safeUrl = (u) => {
    const s = String(u || '').trim();
    return /^(https?:|mailto:|#)/i.test(s) || (s && !/^[a-z][a-z0-9+.-]*:/i.test(s) && !s.startsWith('//')) ? s : '';
  };
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const short = (d) => (/^\d{4}-\d{2}-\d{2}/.test(d || '') ? `${M[Number(d.slice(5, 7)) - 1]} ${Number(d.slice(8, 10))}` : '');
  // Markdown for the bio: escaped first, then paragraphs, **bold**, *italic*, `code` and [links](https://...).
  const md = (src) => String(src || '').trim().split(/\n\s*\n/).map((p) => '<p>' + esc(p)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (all, t, u) => {
      const h = safeUrl(u.replace(/&amp;/g, '&'));
      return h ? `<a href="${esc(h)}">${t}</a>` : t;
    })
    .replace(/\n/g, '<br>') + '</p>').join('');
  const b = cfg.blog || {};
  const sections = (cfg.sections || []).map((s) => ({ ...s, id: s.id || s.type }));
  const pub = (cfg.posts || []).filter((p) => p.status === 'public' && p.title && p.date).sort((x, y) => y.date.localeCompare(x.date));
  const tags = [...new Set(pub.flatMap((p) => p.tags || []))].sort((x, y) => x.localeCompare(y));
  let tag = null;

  const row = (href, date, title, note, dated = true) => {
    const inner = `${dated ? `<span class="bl-d">${esc(short(date))}</span>` : ''}<span class="bl-t">${esc(title)}${note ? `<span class="bl-n">${esc(note)}</span>` : ''}</span>`;
    const cls = `bl-row${dated ? '' : ' bl-row--plain'}`;
    const h = safeUrl(href);
    return `<li>${h ? `<a class="${cls}" href="${esc(h)}">${inner}</a>` : `<div class="${cls}">${inner}</div>`}</li>`;
  };
  const byYear = (items, rowOf) => {
    const years = [...new Set(items.map((x) => (x.date || '').slice(0, 4)))];
    return years.map((y) => `${y ? `<div class="bl-yr">${esc(y)}</div>` : ''}<ul class="bl-rows">${items.filter((x) => (x.date || '').slice(0, 4) === y).map(rowOf).join('')}</ul>`).join('');
  };
  const render = {
    posts: (s) => `<section class="bl-ix-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h"><div class="bl-ix-headrow"><h2 id="${esc(s.id)}-h">${esc(s.title)}</h2>${tags.length > 1 ? `<div class="bl-filter" role="group" aria-label="Filter by tag">${['all', ...tags].map((t) => `<button type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}</div><div class="bl-ledger"></div></section>`,
    about: (s) => `<section class="bl-ix-sec bl-ix-about" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h"><h2 id="${esc(s.id)}-h">${esc(s.title)}</h2>${b.bio ? md(b.bio) : '<p class="bl-empty">Tell Claude about yourself to fill this in.</p>'}${(b.links || []).length ? `<div class="bl-links">${b.links.map((l) => (safeUrl(l.url) ? `<a href="${esc(safeUrl(l.url))}">${esc(l.label)}</a>` : '')).join('')}</div>` : ''}</section>`,
    list: (s) => {
      const items = [...(s.items || [])].sort((x, y) => String(y.date || '').localeCompare(String(x.date || '')));
      return `<section class="bl-ix-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h"><h2 id="${esc(s.id)}-h">${esc(s.title)}</h2>${items.length ? byYear(items, (it) => row(it.url, it.date, it.title, it.note)) : ''}</section>`;
    },
    projects: (s) => `<section class="bl-ix-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h"><h2 id="${esc(s.id)}-h">${esc(s.title)}</h2><ul class="bl-rows">${(s.items || []).map((it) => row(it.url, '', it.name, it.description, false)).join('')}</ul></section>`,
    featured: (s) => `<section class="bl-ix-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h"><h2 id="${esc(s.id)}-h">${esc(s.title)}</h2><ul class="bl-rows">${(s.items || []).map((it) => row(it.url, '', it.title, it.note, false)).join('')}</ul></section>`,
  };

  document.getElementById('bl-name').textContent = b.name || '';
  document.title = b.name || '';
  const intro = document.getElementById('bl-intro');
  intro.textContent = b.tagline || '';
  intro.hidden = !b.tagline;
  const shown = sections.filter((s) => render[s.type]);
  document.getElementById('bl-sections').innerHTML = shown.map((s) => render[s.type](s)).join('');
  document.getElementById('bl-nav').innerHTML = shown.map((s) => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join('');

  const draw = () => {
    const box = document.querySelector('.bl-ledger');
    if (!box) return;
    const list = tag ? pub.filter((p) => (p.tags || []).includes(tag)) : pub;
    box.innerHTML = list.length ? byYear(list, (p) => row(p.url, p.date, p.title, '')) : '<p class="bl-empty">No posts yet.</p>';
    document.querySelectorAll('.bl-filter button').forEach((x) => x.setAttribute('aria-pressed', String((x.dataset.tag === 'all' && !tag) || x.dataset.tag === tag)));
  };
  const fromHash = () => {
    const m = decodeURIComponent(location.hash || '').match(/^#tag-(.+)$/);
    tag = m && tags.includes(m[1]) ? m[1] : null;
    draw();
  };
  document.querySelectorAll('.bl-filter button').forEach((x) => x.addEventListener('click', () => {
    tag = x.dataset.tag === 'all' ? null : x.dataset.tag;
    try {
      history.replaceState(null, '', tag ? `#tag-${encodeURIComponent(tag)}` : location.pathname + location.search);
    } catch (_) { /* the URL is a convenience */ }
    draw();
  }));
  window.addEventListener('hashchange', fromHash);
  fromHash();

  if (b.email) {
    const m = document.getElementById('bl-mail');
    const t = document.createElement('span');
    t.textContent = b.email;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bl-textbtn';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Copy email address');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(b.email);
        btn.textContent = 'Copied';
      } catch (_) {
        btn.textContent = 'Select to copy';
      }
      setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
    });
    m.append(t, btn);
  }
  if (location.hash && !/^#tag-/.test(location.hash)) {
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView();
  }
}
</script>
</body>
