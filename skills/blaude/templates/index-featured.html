<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{blogName}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{blogName}}">
<meta property="og:description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontsHref}}">
<style>
{{{tokensCss}}}
{{{baseCss}}}
/* Featured index: the latest post large, older posts below, About beside them */
.bl-wide{max-width:calc(1040px + 2*var(--bl-pad));margin-inline:auto;padding-inline:var(--bl-pad)}
.bl-fx-top{border-bottom:1px solid var(--bl-rule);padding-top:env(safe-area-inset-top)}
.bl-fx-top .bl-wide{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 var(--bl-s2);padding-block:var(--bl-s1)}
.bl-fx-name{margin:0;font:600 17px/1.2 var(--bl-font-heading)}
.bl-fx-nav{display:flex;flex-wrap:wrap;gap:0 var(--bl-s3);font:15px/1.2 var(--bl-font-heading)}
.bl-fx-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;color:var(--bl-ink-muted);text-decoration:none}
.bl-fx-nav a:hover{color:var(--bl-ink)}
.bl-feat{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--bl-s4);align-items:center;padding-block:var(--bl-s4)}
.bl-cover{display:block;aspect-ratio:16/9;border-radius:var(--bl-radius);overflow:hidden;background:var(--bl-surface)}
.bl-cover svg{display:block;width:100%;height:100%}
.bl-feat .bl-kick{margin:0 0 var(--bl-s1);font:600 13px/1.3 var(--bl-font-heading);color:var(--bl-accent)}
.bl-feat h2{margin:0 0 var(--bl-s2);font:600 clamp(28px,4vw,38px)/1.12 var(--bl-font-heading);letter-spacing:-.01em}
.bl-feat h2 a{color:inherit;text-decoration:none}
.bl-feat p{margin:0 0 var(--bl-s3);color:var(--bl-ink-muted)}
.bl-read{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--bl-s2);border-radius:var(--bl-radius);background:var(--bl-accent);color:var(--bl-accent-ink);font:600 15px/1 var(--bl-font-heading);text-decoration:none}
.bl-rest{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--bl-s4);padding-top:var(--bl-s4);border-top:1px solid var(--bl-rule)}
.bl-rest--solo{grid-template-columns:minmax(0,1fr)}
.bl-fx-sec+.bl-fx-sec{margin-top:var(--bl-s4)}
.bl-fx-headrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 var(--bl-s2)}
.bl-fx-sec h3,.bl-fx-about h3{margin:0;font:600 13px/1.3 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-filter{display:flex;flex-wrap:wrap;gap:0;font:14px/1.2 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-filter button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 var(--bl-s1);border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.bl-filter button[aria-pressed=true]{color:var(--bl-ink);text-decoration:underline;text-decoration-color:var(--bl-accent);text-decoration-thickness:2px;text-underline-offset:4px}
.bl-items{list-style:none;margin:0;padding:0}
.bl-item{display:block;padding-block:var(--bl-s2);border-bottom:1px solid var(--bl-rule);color:inherit;text-decoration:none}
a.bl-item:hover .bl-it{color:var(--bl-accent)}
.bl-it{display:block;font:600 19px/1.3 var(--bl-font-heading)}
.bl-im{display:block;font:14px/1.4 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-empty{margin:var(--bl-s2) 0 0;color:var(--bl-ink-muted);font-style:italic}
.bl-fx-about{font-size:16px}
.bl-fx-about p{margin:0 0 var(--bl-s2)}
.bl-fx-about h3{margin-bottom:var(--bl-s2)}
.bl-av{display:grid;place-items:center;width:56px;height:56px;margin-bottom:var(--bl-s2);border-radius:50%;background:var(--bl-accent);color:var(--bl-accent-ink);font:600 22px/1 var(--bl-font-heading);overflow:hidden}
.bl-av img{width:100%;height:100%;object-fit:cover}
.bl-links{display:flex;flex-wrap:wrap;gap:0 var(--bl-s3);font:15px/1.2 var(--bl-font-heading)}
.bl-links a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;text-decoration:none}
.bl-mail{display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--bl-s2);font:14px/1.4 var(--bl-font-heading);color:var(--bl-ink-muted)}
.bl-fx-foot .bl-wide{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 var(--bl-s2);padding-top:var(--bl-s2);padding-bottom:max(var(--bl-s4),env(safe-area-inset-bottom))}
.bl-fx-foot span{display:inline-flex;align-items:center;min-height:44px}
@media (max-width:760px){
  .bl-feat,.bl-rest{grid-template-columns:minmax(0,1fr);gap:var(--bl-s3)}
  .bl-feat{padding-block:var(--bl-s3)}
}
{{{overridesCss}}}
</style>
</head>
<body>
<header class="bl-fx-top"><div class="bl-wide" data-bl-region="header"><h1 class="bl-fx-name" id="bl-name">{{blogName}}</h1><nav class="bl-fx-nav" id="bl-nav" aria-label="Sections"></nav></div></header>
<main class="bl-wide" id="bl-main" data-bl-region="body"></main>
<footer class="bl-foot bl-fx-foot"><div class="bl-wide" data-bl-region="footer"><span id="bl-foot-name">{{blogName}}</span><a class="bl-made" href="https://github.com/Doppp/blaude">Made with Blaude</a></div></footer>
<script type="application/json" id="blaude-config">{{{configJson}}}</script>
<script>
{
  // Renders the whole page from #blaude-config. Every value is text: escaped or set with textContent.
  const cfg = JSON.parse(document.getElementById('blaude-config').textContent);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // http(s), mailto, #anchors, or a relative path (an exported blog); never javascript: or other schemes.
  const safeUrl = (u) => {
    const s = String(u || '').trim();
    return /^(https?:|mailto:|#)/i.test(s) || (s && !/^[a-z][a-z0-9+.-]*:/i.test(s) && !s.startsWith('//')) ? s : '';
  };
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const full = (d) => (/^\d{4}-\d{2}-\d{2}/.test(d || '') ? `${Number(d.slice(8, 10))} ${M[Number(d.slice(5, 7)) - 1]} ${d.slice(0, 4)}` : '');
  const md = (src) => String(src || '').trim().split(/\n\s*\n/).map((p) => '<p>' + esc(p)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (all, t, u) => {
      const h = safeUrl(u.replace(/&amp;/g, '&'));
      return h ? `<a href="${esc(h)}">${t}</a>` : t;
    })
    .replace(/\n/g, '<br>') + '</p>').join('');
  const b = cfg.blog || {};
  const sections = (cfg.sections || []).map((s) => ({ ...s, id: s.id || s.type }));
  const pub = (cfg.posts || []).filter((p) => p.status === 'public' && p.title && p.date).sort((x, y) => y.date.localeCompare(x.date));
  const latest = pub[0] || null;
  const older = pub.slice(1);
  const tags = [...new Set(older.flatMap((p) => p.tags || []))].sort((x, y) => x.localeCompare(y));
  let tag = null;

  // A cover drawn from the title: the same title always gives the same shapes, in theme colours only.
  const cover = (p) => {
    let h = 0;
    for (const c of p.title) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const r = (n) => { h = (h * 1103515245 + 12345) >>> 0; return h % n; };
    let s = '<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="320" height="180" fill="var(--bl-surface)"/>';
    for (let i = 0; i < 7; i++) {
      const x = r(320); const y = r(180); const z = 20 + r(80); const o = (0.08 + r(20) / 100).toFixed(2);
      s += i % 3 === 0 ? `<circle cx="${x}" cy="${y}" r="${z / 2}" fill="var(--bl-accent)" opacity="${o}"/>` : `<rect x="${x - z / 2}" y="${y - z / 4}" width="${z}" height="${z / 2}" rx="8" fill="var(--bl-accent)" opacity="${o}"/>`;
    }
    const label = [(p.tags || [])[0], p.readingMinutes ? `${p.readingMinutes} min` : ''].filter(Boolean).join(' · ');
    if (label) s += `<text x="20" y="160" font-family="var(--bl-font-mono)" font-size="13" fill="var(--bl-ink-muted)">${esc(label)}</text>`;
    return s + '</svg>';
  };
  const item = (href, title, meta) => {
    const inner = `<span class="bl-it">${esc(title)}</span>${meta ? `<span class="bl-im">${esc(meta)}</span>` : ''}`;
    const h = safeUrl(href);
    return `<li>${h ? `<a class="bl-item" href="${esc(h)}">${inner}</a>` : `<div class="bl-item">${inner}</div>`}</li>`;
  };
  const head = (s, extra = '') => `<div class="bl-fx-headrow"><h3 id="${esc(s.id)}-h">${esc(s.title)}</h3>${extra}</div>`;
  const render = {
    posts: (s) => (older.length || !latest ? `<section class="bl-fx-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h">${head({ ...s, title: latest ? 'More writing' : s.title }, tags.length > 1 ? `<div class="bl-filter" role="group" aria-label="Filter by tag">${['all', ...tags].map((t) => `<button type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : '')}<ul class="bl-items bl-more"></ul></section>` : `<span id="${esc(s.id)}"></span>`),
    list: (s) => `<section class="bl-fx-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h">${head(s)}<ul class="bl-items">${[...(s.items || [])].sort((x, y) => String(y.date || '').localeCompare(String(x.date || ''))).map((it) => item(it.url, it.title, [full(it.date), it.note].filter(Boolean).join(' · '))).join('')}</ul></section>`,
    projects: (s) => `<section class="bl-fx-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h">${head(s)}<ul class="bl-items">${(s.items || []).map((it) => item(it.url, it.name, it.description)).join('')}</ul></section>`,
    featured: (s) => `<section class="bl-fx-sec" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h">${head(s)}<ul class="bl-items">${(s.items || []).map((it) => item(it.url, it.title, it.note)).join('')}</ul></section>`,
  };
  const about = (s) => {
    const initial = (b.author || b.name || '?').trim().charAt(0).toUpperCase();
    const av = b.avatar && /^data:image\//.test(b.avatar) ? `<div class="bl-av"><img src="${esc(b.avatar)}" alt=""></div>` : `<div class="bl-av" aria-hidden="true">${esc(initial)}</div>`;
    return `<aside class="bl-fx-about" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-h"><h3 id="${esc(s.id)}-h">${esc(s.title)}</h3>${av}${b.bio ? md(b.bio) : '<p class="bl-empty">Tell Claude about yourself to fill this in.</p>'}${(b.links || []).length ? `<div class="bl-links">${b.links.map((l) => (safeUrl(l.url) ? `<a href="${esc(safeUrl(l.url))}">${esc(l.label)}</a>` : '')).join('')}</div>` : ''}<div class="bl-mail" id="bl-mail"></div></aside>`;
  };

  document.getElementById('bl-name').textContent = b.name || '';
  document.getElementById('bl-foot-name').textContent = b.name || '';
  document.title = b.name || '';
  const aboutSec = sections.find((s) => s.type === 'about');
  const left = sections.filter((s) => render[s.type]).map((s) => render[s.type](s)).join('');
  const feat = latest ? `<div class="bl-feat"><a class="bl-cover" href="${esc(safeUrl(latest.url))}" tabindex="-1" aria-hidden="true">${cover(latest)}</a><div><p class="bl-kick">Latest · ${esc(full(latest.date))}</p><h2><a href="${esc(safeUrl(latest.url))}">${esc(latest.title)}</a></h2>${latest.description ? `<p>${esc(latest.description)}</p>` : ''}<a class="bl-read" href="${esc(safeUrl(latest.url))}">Read the post</a></div></div>` : '';
  document.getElementById('bl-main').innerHTML = `${feat}<div class="bl-rest${aboutSec ? '' : ' bl-rest--solo'}"><div>${left}</div>${aboutSec ? about(aboutSec) : ''}</div>`;
  document.getElementById('bl-nav').innerHTML = sections.filter((s) => render[s.type] || s.type === 'about').map((s) => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join('');

  const draw = () => {
    const box = document.querySelector('.bl-more');
    if (!box) return;
    const list = tag ? older.filter((p) => (p.tags || []).includes(tag)) : older;
    box.innerHTML = list.length ? list.map((p) => item(p.url, p.title, [full(p.date), p.readingMinutes ? `${p.readingMinutes} min read` : ''].filter(Boolean).join(' · '))).join('') : '<li class="bl-empty">No posts yet.</li>';
    document.querySelectorAll('.bl-filter button').forEach((x) => x.setAttribute('aria-pressed', String((x.dataset.tag === 'all' && !tag) || x.dataset.tag === tag)));
  };
  const fromHash = () => {
    const m = decodeURIComponent(location.hash || '').match(/^#tag-(.+)$/);
    tag = m && tags.includes(m[1]) ? m[1] : null;
    draw();
  };
  document.querySelectorAll('.bl-filter button').forEach((x) => x.addEventListener('click', () => {
    tag = x.dataset.tag === 'all' ? null : x.dataset.tag;
    try {
      history.replaceState(null, '', tag ? `#tag-${encodeURIComponent(tag)}` : location.pathname + location.search);
    } catch (_) { /* the URL is a convenience */ }
    draw();
  }));
  window.addEventListener('hashchange', fromHash);
  fromHash();

  const mail = document.getElementById('bl-mail');
  if (b.email && mail) {
    const t = document.createElement('span');
    t.textContent = b.email;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bl-textbtn';
    btn.textContent = 'Copy';
    btn.setAttribute('aria-label', 'Copy email address');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(b.email);
        btn.textContent = 'Copied';
      } catch (_) {
        btn.textContent = 'Select to copy';
      }
      setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
    });
    mail.append(t, btn);
  }
  if (location.hash && !/^#tag-/.test(location.hash)) {
    const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView();
  }
}
</script>
</body>
</html>
