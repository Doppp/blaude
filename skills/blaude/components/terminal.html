<!-- blaude component: terminal. Commands that type themselves out with their output.
     Starts when scrolled into view; Replay button; instant under reduced motion. -->
<style data-bl-component="terminal">
.bl-terminal{margin:var(--bl-s3) 0;background:var(--bl-term-bg);color:var(--bl-term-ink);border-radius:var(--bl-radius);overflow:hidden}
.bl-term-top{display:flex;align-items:center;gap:var(--bl-s1);min-height:44px;padding:0 var(--bl-s1) 0 var(--bl-s2);border-bottom:1px solid var(--bl-term-rule)}
.bl-term-top i{width:11px;height:11px;border-radius:50%;background:var(--bl-term-rule);flex:none}
.bl-term-top span{margin-left:var(--bl-s1);font:13px/1.2 var(--bl-font-mono);color:var(--bl-term-dim)}
.bl-term-replay{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 var(--bl-s1);margin-left:auto;border:0;background:none;color:var(--bl-term-ink);font:600 13px/1 var(--bl-font-heading);cursor:pointer}
.bl-term-screen{display:grid;overflow-x:auto}
.bl-term-screen>pre{grid-area:1/1;margin:0;padding:var(--bl-s2);background:none;border-radius:0;font:13.5px/1.65 var(--bl-font-mono);color:var(--bl-term-ink);white-space:pre;overflow:visible}
.bl-term-screen>pre[aria-hidden=true]{visibility:hidden}
.bl-term-line[data-kind=cmd]::before,.bl-term-p::before{content:"$ ";color:var(--bl-term-key)}
.bl-term-line[data-kind=out]{color:var(--bl-term-dim)}
.bl-term-line[data-kind=ok]{color:var(--bl-term-ok)}
.bl-term-caret{display:inline-block;width:8px;height:1.1em;vertical-align:-2px;background:var(--bl-term-ink);animation:bl-blink 1s steps(1) infinite}
@keyframes bl-blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bl-term-caret{animation:none}}
</style>
<template data-bl-markup>
<div class="bl-terminal" role="group" aria-label="{{label}}">
<div class="bl-term-top"><i></i><i></i><i></i><span>{{title}}</span><button class="bl-term-replay" type="button" hidden>Replay</button></div>
<div class="bl-term-screen"><pre><code>{{#lines}}<span class="bl-term-line" data-kind="{{kind}}">{{text}}</span>
{{/lines}}</code></pre></div>
</div>
</template>
<script data-bl-component="terminal">
{
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  for (const root of document.querySelectorAll('.bl-terminal')) {
    try {
      const screen = root.querySelector('.bl-term-screen');
      const full = screen.querySelector('pre');
      const lines = [...full.querySelectorAll('.bl-term-line')].map((l) => ({ kind: l.dataset.kind || 'out', text: l.textContent }));
      // The full transcript stays in place, invisible, so the box is sized to its content.
      full.setAttribute('aria-hidden', 'true');
      full.querySelector('code').insertAdjacentHTML('beforeend', '<span class="bl-term-p"></span>');
      const live = document.createElement('pre');
      live.setAttribute('aria-label', root.getAttribute('aria-label') || 'Terminal');
      screen.appendChild(live);
      const replay = root.querySelector('.bl-term-replay');
      let run = 0;
      const type = async () => {
        const me = ++run;
        let html = '';
        const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
        const paint = (extra) => { if (me === run) live.innerHTML = html + (extra || ''); };
        if (reduce) {
          html = lines.map((l) => (l.kind === 'cmd' ? `<span class="bl-term-p"></span>${esc(l.text)}` : `<span class="bl-term-line" data-kind="${l.kind}">${esc(l.text)}</span>`)).join('\n') + '\n';
          paint('<span class="bl-term-p"></span>');
          return;
        }
        for (const l of lines) {
          if (me !== run) return;
          if (l.kind === 'cmd') {
            let typed = '';
            for (const ch of l.text) {
              typed += ch;
              paint(`<span class="bl-term-p"></span>${esc(typed)}<span class="bl-term-caret"></span>`);
              await wait(30);
            }
            html += `<span class="bl-term-p"></span>${esc(l.text)}\n`;
            await wait(420);
          } else {
            html += `<span class="bl-term-line" data-kind="${l.kind}">${esc(l.text)}</span>\n`;
            paint();
            await wait(160);
          }
        }
        paint('<span class="bl-term-p"></span><span class="bl-term-caret"></span>');
      };
      replay.hidden = false;
      replay.addEventListener('click', type);
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((es) => {
          if (es.some((e) => e.isIntersecting)) { io.disconnect(); type(); }
        }, { threshold: 0.4 });
        io.observe(root);
      } else type();
    } catch (e) {
      console.error('blaude terminal', e);
    }
  }
}
</script>
